name: Deploy
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SHUFFLE_SERVER_IP }}
          username: shuffle
          key: ${{ secrets.SHUFFLE_DEPLOY_KEY }}
          script: |
            set -e
            cd /srv/shuffle
            git fetch origin master
            git reset --hard origin/master
            npm ci
            sudo systemctl restart shuffle
